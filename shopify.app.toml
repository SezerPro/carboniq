# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "83fa1af392157c68b11d0668cf4a4010"
name = "carboniq"
application_url = "https://carboniq-sigma.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "products/create" ]
  uri = "/webhooks/products/create"

  [[webhooks.subscriptions]]
  topics = [ "products/delete" ]
  uri = "/webhooks/products/delete"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks"

[app_proxy]
url = "https://carboniq-sigma.vercel.app"
subpath = "carboniq"
prefix = "apps"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,write_metaobject_definitions,write_metaobjects"

# Protected Customer Data declaration
# Carboniq stores customer email and name on impact certificates ONLY when:
#  - The customer voluntarily opts into carbon offset at checkout
#  - The customer provides their email on the storefront offset form
# These fields are never pulled from Shopify webhooks or GraphQL.
# Authoritative declaration: Partner Dashboard > Customer data protection level.
[access.protected_customer_data]
customer_data_protection_level = "level_1"

  [[access.protected_customer_data.fields]]
  field = "email"

  [[access.protected_customer_data.fields]]
  field = "name"

[auth]
redirect_urls = [ "https://carboniq-sigma.vercel.app/auth/callback" ]

[product.metafields.carboniq.co2_score]
type = "number_decimal"
name = "CO₂ Score (kgCO₂e)"
description = "Carbon footprint score in kgCO₂e calculated by Carboniq"

  [product.metafields.carboniq.co2_score.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[product.metafields.carboniq.co2_label]
type = "single_line_text_field"
name = "CO₂ Label"
description = "Carbon impact label: LOW, MEDIUM, HIGH, or VERY_HIGH"

  [product.metafields.carboniq.co2_label.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[product.metafields.carboniq.co2_grade]
type = "single_line_text_field"
name = "CO₂ Grade"
description = "Carbon grade: A (low) to D (very high)"

  [product.metafields.carboniq.co2_grade.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[product.metafields.carboniq.co2_category]
type = "single_line_text_field"
name = "CO₂ Category"
description = "ADEME emission factor category code used for calculation"

  [product.metafields.carboniq.co2_category.access]
  admin = "merchant_read_write"
  storefront = "public_read"
